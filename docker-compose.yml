services:
  adetalle:
    build: .
    container_name: adetalle
    restart: unless-stopped
    networks:
      - web

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
